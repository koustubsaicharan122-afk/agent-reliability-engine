services:
  - type: web
    name: agent-reliability-engine
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_AGENT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_JUDGE_MODEL
        value: gemini-3.6-flash
